name: Desktop app tests

on:
  push:
    paths: ["desktop_qt/**", ".github/workflows/desktop-tests.yml"]
  pull_request:
    paths: ["desktop_qt/**", ".github/workflows/desktop-tests.yml"]

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop_qt
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            desktop_qt/requirements.txt
            desktop_qt/requirements-dev.txt

      - name: Install dependencies
        # pyOptris (thermal camera, git dependency) is not needed by the tests.
        shell: bash
        run: |
          grep -v -i "pyoptris" requirements.txt > requirements-ci.txt
          # Dev tools (pytest, pytest-qt, pyvisa-sim) without the "-r requirements.txt"
          # line, so the simulated-rig tests run here instead of being skipped.
          grep -v "^-r" requirements-dev.txt > requirements-dev-ci.txt
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt -r requirements-dev-ci.txt

      - name: Lint (Ruff)
        run: ruff check --output-format github

      - name: Type check (Pyright)
        shell: bash
        run: pyright --pythonpath "$(python -c 'import sys; print(sys.executable)')"

      - name: Run tests (coverage gate in pyproject.toml)
        run: python -m pytest -q --cov --cov-report=term-missing:skip-covered
